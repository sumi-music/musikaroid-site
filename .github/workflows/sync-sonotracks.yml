name: Sync sonoTracks releases

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sonotracks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and diff releases
        id: sync
        env:
          SLUG: musikaroid-records
          PER_PAGE: '24'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime, sys
          slug = os.environ['SLUG']
          per = int(os.environ['PER_PAGE'])
          def fetch(page):
              url = f"https://sono-tracks.com/api/tracks/public/artist-releases?slug={slug}&limit={per}&page={page}"
              req = urllib.request.Request(url, headers={'User-Agent': 'sonotracks-sync/1.0'})
              return json.load(urllib.request.urlopen(req, timeout=20))
          try:
              first = fetch(1)
              releases = list(first['releases'])
              for p in range(2, first.get('totalPages', 1) + 1):
                  releases.extend(fetch(p)['releases'])
          except Exception as e:
              print(f"::warning::fetch failed, keeping existing releases.json: {e}")
              print("changed=false", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
              sys.exit(0)
          new = {
              "releases": releases,
              "total": first.get('total', len(releases)),
              "artistUrl": first.get('artistUrl'),
              "syncedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          try:
              old = json.load(open('releases.json'))
              old_cmp = {k: v for k, v in old.items() if k != 'syncedAt'}
              new_cmp = {k: v for k, v in new.items() if k != 'syncedAt'}
              if old_cmp == new_cmp:
                  print("no content change (only syncedAt differs)")
                  print("changed=false", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
                  sys.exit(0)
          except FileNotFoundError:
              pass
          with open('releases.json', 'w') as f:
              f.write(json.dumps(new, ensure_ascii=False, indent=2) + '\n')
          print(f"wrote {len(releases)} releases")
          print("changed=true", file=open(os.environ['GITHUB_OUTPUT'], 'a'))
          PY

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "sonotracks-sync"
          git config user.email "actions@github.com"
          git add releases.json
          git commit -m "sync sonotracks releases"
          git push
